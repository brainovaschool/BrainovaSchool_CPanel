<!DOCTYPE html>
<html lang="en">
<head>

<title>Brainova Intelligent Assessment &amp; Placement System</title>

<style id="appcss">
/* Layout: persistent role sidebar + working area; student runner and live stage are separate full-width modes. */

  --navy: #17233B; --purple: #5420A8; --purple-soft: #EEE7FA; --on-purple: #FFFFFF; --teal: #14B8A6; --teal-ink: #0B6B61; --teal-soft: #DDF6F2;
  --ok: #0E8F80; --ok-soft: #DDF4F0; --bad: #C0314B; --bad-soft: #FBE6EA; --warn: #9A5B00; --warn-soft: #FDF0D8; --skip: #8A93A8;
  --lv0: #E4DAF5; --lv0t: #2A1A52; --lv1: #C7B3EB; --lv1t: #2A1A52; --lv2: #A084DB; --lv2t: #17102E; --lv3: #7A4FC4; --lv3t: #FFFFFF; --lv4: #4F1F9E; --lv4t: #FFFFFF;
  --focus: #7C4DDB; --shadow: 0 1px 2px rgba(23,35,59,.06), 0 8px 24px rgba(23,35,59,.06);
  --head: "Plus Jakarta Sans", "Inter", system-ui, sans-serif; --text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1525; --surface: #152136; --surface2: #1B2A44; --ink: #E8ECF6; --muted: #A4AFC5; --line: #2B3A58;
  --purple: #8B63E0; --purple-soft: #2A2150; --on-purple: #FFFFFF; --teal: #2DD4BF; --teal-ink: #5EEAD4; --teal-soft: #12403F;
  --ok: #3DD6BC; --ok-soft: #12403F; --bad: #F58DA0; --bad-soft: #4A1E2B; --warn: #E8B15A; --warn-soft: #473414; --skip: #7F8AA3;
  --lv0: #3A3466; --lv0t: #E8ECF6; --lv1: #54488C; --lv1t: #F3EEFF; --lv2: #7B65BA; --lv2t: #FFFFFF; --lv3: #A98FEA; --lv3t: #1A1030; --lv4: #D2C2FF; --lv4t: #1A1030;
  --focus: #B79CFF; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D1525; --surface: #152136; --surface2: #1B2A44; --ink: #E8ECF6; --muted: #A4AFC5; --line: #2B3A58;
  --purple: #8B63E0; --purple-soft: #2A2150; --on-purple: #FFFFFF; --teal: #2DD4BF; --teal-ink: #5EEAD4; --teal-soft: #12403F;
  --ok: #3DD6BC; --ok-soft: #12403F; --bad: #F58DA0; --bad-soft: #4A1E2B; --warn: #E8B15A; --warn-soft: #473414; --skip: #7F8AA3;
  --lv0: #3A3466; --lv0t: #E8ECF6; --lv1: #54488C; --lv1t: #F3EEFF; --lv2: #7B65BA; --lv2t: #FFFFFF; --lv3: #A98FEA; --lv3t: #1A1030; --lv4: #D2C2FF; --lv4t: #1A1030;
  --focus: #B79CFF; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 14px; line-height: 1.5; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { font-family: var(--head); margin: 0; line-height: 1.2; text-wrap: balance; color: var(--ink); }
h1 { font-size: 24px; font-weight: 800; letter-spacing: -.01em; } h2 { font-size: 18px; font-weight: 700; } h3 { font-size: 15px; font-weight: 700; } h4 { font-size: 13px; font-weight: 700; }
p { margin: 0; } a { color: var(--purple); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--muted); } .small { font-size: 12px; } .mono { font-family: var(--mono); } .nowrap { white-space: nowrap; } .right { text-align: right; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* app shell */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--navy); color: #E8ECF6; padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow: auto; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px; }
.brand svg { flex: none; } .brand b { font-family: var(--head); font-size: 17px; letter-spacing: .02em; color: #fff; display: block; line-height: 1.1; } .brand span { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: #9FB0CF; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; box-sizing: border-box; cursor: pointer; padding: 9px 12px; border-radius: 8px; color: #C9D3E8; font-weight: 500; display: flex; gap: 10px; align-items: center; }
.nav button:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav button[aria-current="page"] { background: rgba(255,255,255,.12); color: #fff; box-shadow: inset 3px 0 0 var(--teal); }
.nav button:focus-visible { outline: 3px solid #B79CFF; }
.nav svg { width: 16px; height: 16px; flex: none; opacity: .85; }
.side .note { margin-top: auto; font-size: 11px; color: #9FB0CF; padding: 0 8px; line-height: 1.45; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 12px max(24px, env(safe-area-inset-right, 0px)) 12px 24px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.roles { display: inline-flex; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.roles button { all: unset; cursor: pointer; padding: 6px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--muted); }
.roles button[aria-pressed="true"] { background: var(--purple); color: var(--on-purple); }
.roles button:focus-visible { outline: 3px solid var(--focus); }
.page { padding: 24px max(24px, env(safe-area-inset-right, 0px)) 64px 24px; display: flex; flex-direction: column; gap: 20px; max-width: 1280px; width: 100%; }
.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-end; }
.page-head p { color: var(--muted); margin-top: 4px; max-width: 70ch; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; } .row.sp { justify-content: space-between; } .stack { display: flex; flex-direction: column; gap: 12px; }
.grid { display: grid; gap: 16px; } .g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); } .g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); } .g4 { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; }
.card.lift { box-shadow: var(--shadow); } .card > h2, .card > h3 { margin-bottom: 12px; }
.sub { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.kpi { display: flex; flex-direction: column; gap: 2px; } .kpi b { font-family: var(--head); font-size: 28px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; } .kpi span { color: var(--muted); font-size: 12px; }

/* controls */
.btn { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 9px; font-weight: 600; font-size: 13px; background: var(--purple); color: var(--on-purple); border: 1px solid transparent; text-align: center; }
.btn:hover { filter: brightness(1.08); } .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); } .btn.ghost:hover { background: var(--surface2); filter: none; }
.btn.teal { background: var(--teal); color: #052B27; } .btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: 12px; } .btn.lg { padding: 12px 22px; font-size: 15px; border-radius: 11px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; pointer-events: none; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); min-width: 0; }
input[type=text], input[type=number], input[type=search], input[type=url], input[type=password], input[type=date], select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; }
textarea { min-height: 76px; resize: vertical; } input:disabled, select:disabled { opacity: .55; }
input[type=checkbox], input[type=radio] { accent-color: var(--purple); width: 16px; height: 16px; flex: none; margin: 0; }
.chk { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; font-weight: 500; color: var(--ink); cursor: pointer; } .chk span { min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { all: unset; box-sizing: border-box; cursor: pointer; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface); }
.chip[aria-pressed="true"] { background: var(--purple); border-color: var(--purple); color: var(--on-purple); } .chip:focus-visible { outline: 3px solid var(--focus); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; background: var(--surface2); color: var(--muted); border: 1px solid var(--line); }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; } .pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; } .pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; } .pill.pur { background: var(--purple-soft); color: var(--purple); border-color: transparent; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.pur { color: #C9B6FF; } } :root[data-theme="dark"] .pill.pur { color: #C9B6FF; }
.lv { display: inline-flex; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.lv0 { background: var(--lv0); color: var(--lv0t); } .lv1 { background: var(--lv1); color: var(--lv1t); } .lv2 { background: var(--lv2); color: var(--lv2t); } .lv3 { background: var(--lv3); color: var(--lv3t); } .lv4 { background: var(--lv4); color: var(--lv4t); } .lvn { background: var(--surface2); color: var(--muted); border: 1px dashed var(--line); }
.banner { border-radius: 10px; padding: 10px 14px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); background: var(--surface2); }
.banner.warn { background: var(--warn-soft); border-color: transparent; color: var(--ink); } .banner.info { background: var(--purple-soft); border-color: transparent; } .banner.ok { background: var(--ok-soft); border-color: transparent; } .banner.bad { background: var(--bad-soft); border-color: transparent; }
table { width: 100%; border-collapse: collapse; font-size: 13px; } .tw { overflow-x: auto; max-width: 100%; }
th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; } tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface2); } td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; align-items: end; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs button { all: unset; cursor: pointer; padding: 9px 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; } .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--purple); } .tabs button:focus-visible { outline: 3px solid var(--focus); }
.steps { display: flex; gap: 6px; flex-wrap: wrap; } .steps button { all: unset; cursor: pointer; padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--muted); border: 1px solid var(--line); background: var(--surface); }
.steps button[aria-current="step"] { background: var(--purple); border-color: var(--purple); color: var(--on-purple); } .steps button:focus-visible { outline: 3px solid var(--focus); }
details > summary { cursor: pointer; font-weight: 600; } details.sub { padding: 8px 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(20px, env(safe-area-inset-bottom, 0px)); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 50; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }

/* bars & charts */
.bars { display: flex; flex-direction: column; gap: 9px; } .bar-row { display: grid; grid-template-columns: minmax(90px, 150px) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 12px; }
.bar-row .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .bar-row .val { white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.track { height: 10px; background: var(--surface2); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; } .fill { height: 100%; background: var(--purple); border-radius: 0 4px 4px 0; }
.fill.teal { background: var(--teal); }
.stackbar { display: flex; gap: 2px; height: 14px; border-radius: 4px; overflow: hidden; background: var(--surface2); } .stackbar i { display: block; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); } .legend span { display: inline-flex; gap: 6px; align-items: center; } .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.ability { display: grid; grid-template-columns: minmax(100px, 170px) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); } .ability:last-child { border-bottom: 0; }
.atrack { position: relative; height: 22px; display: flex; gap: 2px; } .atrack .seg { flex: 1; border-radius: 3px; opacity: .55; } .atrack .dot { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); border: 2px solid var(--surface); transform: translate(-50%, -50%); } .atrack .whisk { position: absolute; top: 50%; height: 2px; background: var(--ink); transform: translateY(-50%); }
.svgchart text { fill: var(--muted); font-size: 11px; font-family: var(--text); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; } .tile { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; } .tile b { display: block; font-family: var(--head); font-size: 20px; font-variant-numeric: tabular-nums; } .tile span { font-size: 11px; color: var(--muted); }
.dot-ok, .dot-bad, .dot-skip { display: inline-block; width: 9px; height: 9px; border-radius: 50%; } .dot-ok { background: var(--ok); } .dot-bad { background: var(--bad); } .dot-skip { background: var(--skip); }
.ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; } .ul.plain { list-style: none; padding: 0; }
pre.code { font-family: var(--mono); font-size: 13px; background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; white-space: pre; max-width: 100%; }
.passage { background: var(--surface2); border-left: 4px solid var(--teal); padding: 10px 14px; border-radius: 6px; font-size: 14px; margin-bottom: 10px; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; border: 1px dashed var(--line); border-radius: 12px; }

/* student runner */
.runner-wrap { min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; }
.run-head { background: var(--navy); color: #fff; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: space-between; }
.run-head b { font-family: var(--head); } .timer { font-family: var(--head); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; } .timer.low { color: #FFB4C0; }
.run-body { width: 100%; max-width: 820px; margin: 0 auto; padding: 22px max(16px, env(safe-area-inset-right, 0px)) 80px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
.progress { height: 8px; background: var(--line); border-radius: 6px; overflow: hidden; } .progress i { display: block; height: 100%; background: var(--teal); }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; box-shadow: var(--shadow); } .qtext { font-size: 19px; line-height: 1.45; font-weight: 600; font-family: var(--head); white-space: pre-wrap; }
.qimg { max-width: 100%; max-height: 260px; border-radius: 8px; margin: 10px 0; display: block; }
.opts { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.opt { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 12px; align-items: center; padding: 13px 14px; border: 2px solid var(--line); border-radius: 12px; font-size: 16px; background: var(--surface); font-weight: 500; width: 100%; }
.opt:hover { border-color: var(--purple); } .opt[aria-checked="true"] { border-color: var(--purple); background: var(--purple-soft); } .opt:focus-visible { outline: 3px solid var(--focus); }
.opt .ltr { flex: none; width: 28px; height: 28px; border-radius: 8px; background: var(--surface2); display: grid; place-items: center; font-weight: 700; font-size: 13px; border: 1px solid var(--line); } .opt[aria-checked="true"] .ltr { background: var(--purple); color: var(--on-purple); border-color: var(--purple); }
.answer-in { font-size: 20px; padding: 12px 14px; max-width: 320px; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; } .dots button { all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 700; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.dots button.ans { background: var(--teal-soft); color: var(--teal-ink); border-color: transparent; } .dots button.cur { outline: 3px solid var(--purple); } .dots button:focus-visible { outline: 3px solid var(--focus); }
.ordl { display: flex; flex-direction: column; gap: 8px; } .ordl .it { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.ordl .n { width: 24px; height: 24px; border-radius: 6px; background: var(--purple); color: var(--on-purple); display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
.countdown { height: 6px; background: rgba(255,255,255,.2); border-radius: 4px; overflow: hidden; width: 160px; } .countdown i { display: block; height: 100%; background: var(--teal); }

/* live stage: always dark for projection */
.stage { background: #0F1A2E; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
.stage .bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; padding: 12px 22px; background: #17233B; }
.stage .bar .btn.ghost { color: #fff; border-color: rgba(255,255,255,.3); } .stage .bar .btn.ghost:hover { background: rgba(255,255,255,.1); }
.stage-main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; padding: 22px; }
.stage-q { display: flex; flex-direction: column; gap: 18px; min-width: 0; } .stage-q .big { font-family: var(--head); font-size: clamp(26px, 4vw, 46px); font-weight: 800; line-height: 1.25; white-space: pre-wrap; }
.stage-q pre.code { background: #17233B; border-color: #2B3A58; color: #E8ECF6; font-size: clamp(16px, 2vw, 24px); }
.stage-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.stage-opt { position: relative; padding: 18px 20px; border-radius: 14px; background: #1E2D4A; border: 3px solid #2B3A58; font-size: clamp(18px, 2.4vw, 28px); font-weight: 700; display: flex; gap: 14px; align-items: center; overflow: hidden; }
.stage-opt .ltr { width: 40px; height: 40px; border-radius: 10px; background: #5420A8; display: grid; place-items: center; font-size: 20px; flex: none; }
.stage-opt.right { border-color: #2DD4BF; background: #0F4F4A; } .stage-opt.wrong { opacity: .5; } .stage-opt .cnt { margin-left: auto; font-size: 20px; opacity: .9; font-variant-numeric: tabular-nums; }
.stage-opt .distb { position: absolute; left: 0; bottom: 0; height: 5px; background: #2DD4BF; }
.stage .big-timer { font-family: var(--head); font-size: 64px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; } .stage .big-timer.low { color: #FFB4C0; }

function buildBank() {
  const bank = [];
  for (const t of MATH_TOPICS) for (const d of DIFF_KEYS) {
    const seen = new Set();
    for (let n = 1, tries = 0; seen.size < 8 && tries < 60; tries++) {
      const q = genMathQ(t, d, `${t}-${d}-${tries}`, n);
      if (seen.has(q.text)) continue;
      seen.add(q.text); bank.push(q); n++;
    }
  }
  return bank.concat(buildStaticBank());
}

    if (q.type === 'mcq' || q.type === 'tf') { const pick = good ? qi.options.find(o => o.id === qi.answer) : R.pick(qi.options.filter(o => o.id !== qi.answer)); raw = pick.id; }
    else if (q.type === 'num') raw = good ? String(q.answer) : String(q.wrong && q.wrong.length && R.f() < 0.7 ? R.pick(q.wrong)[0] : q.answer + R.int(1, 9));
    else if (q.type === 'fill') raw = good ? q.accept[0] : 'not sure';
    else if (q.type === 'short') raw = good ? q.keywords[0] : 'I do not know';
    else if (q.type === 'order') raw = good ? q.items.slice() : R.shuffle(q.items);
    else if (q.type === 'match') raw = q.pairs.map((p, i) => good ? p[1] : q.pairs[(i + 1) % q.pairs.length][1]);
    else if (q.type === 'manual') raw = 'Sample response text for review.';
    return makeResponse(seq, qi, raw, ms, { probe, changed: R.f() < 0.06 ? 1 : 0, visits: 1 });
  };
  if (a.model === 'adaptive') {
    const ad = new Adaptive(a, bank, seed + '-ad');
    while (!ad.done()) { const q = ad.next(), r = resolve(q, att.responses.length + 1, !!q._probe); att.responses.push(r); ad.record(r); }
    att.trace = ad.trace; att.stopReason = ad.done();
  } else {
    const fx = buildFixed(a, bank, seed + '-fx'); fx.items.forEach((q, i) => att.responses.push(resolve(q, i + 1, false)));
  }
  att.durationMs = Math.round(sum(att.responses, r => r.timeMs) + 15000);
  att.finished = when + att.durationMs;
  att.supervision = a.parentSupervision ? { confirmed: true, by: 'Parent/guardian', at: when - 60000 } : null;
  return att;
}


/* ===================== GOOGLE SHEETS API ADAPTER =====================
   Talks to a Google Apps Script web app (wired up in a later step).
   Until BrainovaAPI.configure() is given a real url, every call below
   is a harmless no-op and the app behaves exactly like the
   localStorage-only demo did. Once configured: localStorage is still
   written first on every save() (see core.js) and remains the offline
   cache; everything sent onward also goes through this persisted
   outbox queue, so a dropped connection never loses an attempt or an
   answer - it just waits in localStorage until the network (or the
   next page load) lets it through. */
(function () {
  const CFG_KEY = 'brainova.apiconfig.v1';
  const QUEUE_KEY = 'brainova.outbox.v1';
  const SNAPSHOT_COLLECTIONS = ['students', 'parents', 'assessments', 'bank', 'settings', 'supervision'];

  let cfg = { url: '', token: '' };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem(CFG_KEY) || '{}')); } catch (e) { /* ignore */ }

  // The signed per-user token from the LMS handoff (see identity.js).
  // Deliberately kept in memory only, never in the persisted cfg above -
  // it's short-lived by design, so caching it across visits would just
  // mean resending a stale one. Set via setAuthToken() on every login.
  let authToken = '';

  let queue = [];
  try { queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch (e) { /* ignore */ }

  let flushing = false, syncTimer = 0, retryTimer = 0;

  function isConfigured() { return !!cfg.url; }
  function persistQueue() { try { localStorage.setItem(QUEUE_KEY, JSON.stringify(queue)); } catch (e) { /* ignore */ } }

  function configure(opts) {
    cfg = Object.assign({}, cfg, opts || {});
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) { /* ignore */ }
    flush();
  }

  // Apps Script's doPost doesn't need a CORS preflight as long as the
  // request body is sent as text/plain, so that's what every write uses.
  // A hard timeout matters here specifically because a slow write (a
  // big snapshot, or Apps Script itself being slow to respond) would
  // otherwise leave flush() waiting forever on this one fetch, with
  // flushing staying true and every later retry silently doing nothing -
  // the queue would look permanently "stuck" with no error ever shown.
  async function post(body) {
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), 25000) : 0;
    let res;
    try {
      res = await fetch(cfg.url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ token: cfg.token, authToken }, body)),
        signal: ctrl ? ctrl.signal : undefined
      });
    } catch (e) {
      if (e && e.name === 'AbortError') throw new Error('timed out waiting for a response');
      throw e;
    } finally { clearTimeout(timer); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data && data.ok === false) throw new Error(data.error || 'Request rejected');
    return data;
  }

  function enqueue(kind, payload) {
    if (!isConfigured()) return; // nothing to talk to yet - stay a no-op, same as before this adapter existed
    queue.push({ id: 'q_' + Math.random().toString(36).slice(2, 9), kind, payload, ts: Date.now() });
    persistQueue();
    flush();
  }

  // A stuck sync used to fail completely silently - the Settings page's
  // "N change(s) waiting to sync" pill was the only clue something was
  // wrong, with no way to see why. Surfacing the actual error (once per
  // distinct message, not on every 8s retry) is what makes this
  // diagnosable at all instead of a guessing game.
  let lastSyncError_ = '';
  async function flush() {
    if (!isConfigured() || flushing || (typeof navigator !== 'undefined' && navigator.onLine === false)) return;
    flushing = true;
    try {
      while (queue.length) {
        const item = queue[0];
        try {
          await post({ action: 'write', kind: item.kind, payload: item.payload });
          queue.shift();
          persistQueue();
          lastSyncError_ = '';
        } catch (e) {
          const msg = (e && e.message) || 'unknown error';
          if (msg !== lastSyncError_) {
            lastSyncError_ = msg;
            if (typeof toast === 'function') toast('Could not save a change to the Sheet: ' + msg);
          }
          scheduleRetry();
          break; // keep order: don't send item 2 before a stuck item 1 is confirmed
        }
      }
    } finally { flushing = false; }
  }

  function scheduleRetry() {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(flush, 8000);
  }

  if (typeof window !== 'undefined') {
    window.addEventListener('online', flush);
    setInterval(flush, 20000); // safety net in case an 'online' event is missed
  }

  // Debounced: the "administrative" collections (not attempts - those
  // have their own immediate path below) resync a short idle moment
  // after the last change, so typing in a textarea doesn't fire one
  // request per keystroke.
  function scheduleSync(S) {
    if (!isConfigured()) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => { enqueue('snapshot', buildSnapshot(S)); }, 1000);
  }

  // Every collection becomes an array of {id, ...} records, even the two
  // that aren't naturally arrays in the app's own state - that way the
  // backend only ever needs one generic "upsert these records" routine.
  function buildSnapshot(S) {
    const out = {};
    SNAPSHOT_COLLECTIONS.forEach(k => {
      const v = S[k];
      if (Array.isArray(v)) out[k] = v;
      else if (k === 'settings' && v !== undefined) out[k] = [{ id: 'main', json: JSON.stringify(v) }];
      else if (k === 'supervision' && v && typeof v === 'object') out[k] = Object.keys(v).map(id => Object.assign({ id }, v[id]));
    });
    return out;
  }

  // Immediate, per the brief: "save each attempt and its responses as
  // soon as it is submitted (and after every answer in adaptive tests)".
  function saveAttempt(att, analysis) { enqueue('attempt', { attempt: att, analysis: analysis || null }); }
  function saveResponse(attemptId, resp, meta) { enqueue('response', Object.assign({ attemptId, resp }, meta || {})); }
  // Narrower than scheduleSync's full snapshot: upserts exactly one
  // record in one collection. This is the only write kind the backend
  // lets a signed-in student/parent make outside their own attempts -
  // used by identity.js to register their own roster row on first
  // login, without ever letting their browser touch anyone else's data.
  function saveSelf(collection, record) { enqueue('self', { collection, record }); }

  async function fetchSnapshot() {
    if (!isConfigured()) return null;
    try {
      const url = cfg.url + '?action=bootstrap&token=' + encodeURIComponent(cfg.token || '') + '&authToken=' + encodeURIComponent(authToken || '');
      const res = await fetch(url);
      if (!res.ok) return null;
      const data = await res.json();
      return (data && data.ok !== false && data.state) ? data.state : null;
    } catch (e) { return null; }
  }

  function pendingCount() { return queue.length; }
  function getConfig() { return { url: cfg.url, token: cfg.token }; }
  function setAuthToken(t) { authToken = t || ''; }
  // A toast flashes for ~3 seconds and is easy to miss if nobody's
  // watching the screen right when a background retry fires - this lets
  // Settings show the same message any time someone checks, not just
  // the instant it happens.
  function lastSyncError() { return lastSyncError_; }

  flush(); // in case a previous session left queued items waiting for a connection

  window.BrainovaAPI = { configure, isConfigured, getConfig, setAuthToken, scheduleSync, saveAttempt, saveResponse, saveSelf, fetchSnapshot, pendingCount, lastSyncError, flush };
})();

/* ===================== LMS IDENTITY (signed login handoff) =====================
   When the Brainova LMS opens this app, it appends a short-lived signed
   token to the URL (?t=...) instead of leaving the old role switcher on
   screen. This file only reads the token's own claims (uid/role/name/exp)
   to know who is using the app, and hands the raw token to the Google
   Sheets backend (api.js) on every request from here on.

   It does NOT verify the signature - there is no secret in the browser
   to verify it with, by design (see backend/Code.gs's own header comment).
   That verification is Step 5's job, on the server. Until Step 5 lands,
   treat this as "who the LMS says is using it", not yet a security
   boundary - the Sheet itself is still only gated by the one shared
   token from Step 3. When no token is present (or it's missing/expired),
   the app falls back to the old role switcher so it stays testable on
   its own without the LMS. */
const LMS_SESSION_KEY = 'brainova.lmsidentity.v1';

function b64urlDecode_(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  return decodeURIComponent(atob(s).split('').map(c => '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join(''));
}

function parseLmsToken_(token) {
  try {
    const payload = token.split('.')[0];
    if (!payload) return null;
    const claims = JSON.parse(b64urlDecode_(payload));
    if (!claims || !claims.role || !claims.uid || !claims.exp) return null;
    if (claims.exp * 1000 < Date.now()) return null;
    return claims;
  } catch (e) { return null; }
}

// The LMS puts the token on the URL only once, on handoff. It's kept in
// sessionStorage (not localStorage) from then on, so it survives a page
// refresh inside that same tab/iframe but never lingers once it's closed.
function readLmsToken_() {
  const fromUrl = new URLSearchParams(location.search).get('t');
  if (fromUrl) { try { sessionStorage.setItem(LMS_SESSION_KEY, fromUrl); } catch (e) { /* ignore */ } return fromUrl; }
  try { return sessionStorage.getItem(LMS_SESSION_KEY); } catch (e) { return null; }
}

// Called once at startup. Returns true when a real LMS identity takes
// over (role switcher stays hidden); false when the app is on its own.
function applyLmsIdentity() {
  const token = readLmsToken_();
  const claims = token && parseLmsToken_(token);
  if (!claims) { U.lms = null; return false; }

  // The LMS sends uid/children as real numbers (Laravel's own integer
  // ids). Every id already living in this app - demo data, DOM data-id
  // attributes read off a click, you name it - is a string, and a
  // number never === a string in JS, so every lookup and every
  // assign-to-student checkbox would silently fail to match a real
  // student/parent if this stayed a number. Normalize once, here, so
  // nothing downstream has to know this distinction exists.
  const uid = String(claims.uid);
  const children = Array.isArray(claims.children) ? claims.children.map(String) : null;

  U.lms = { token, uid, role: claims.role, name: claims.name || '' };
  U.role = claims.role;
  U.view = HOME[claims.role] || U.view;

  // Registering this person's own roster row (below) uses saveSelf(),
  // not save()'s full scheduleSync - a signed-in student/parent's
  // browser is only ever allowed to write their OWN row on the backend
  // (see Code.gs's writeAllowed_), never a full administrative snapshot.
  if (claims.role === 'student') {
    U.studentId = uid;
    // First time this LMS student opens the tool: give them a minimal
    // row so every existing "find the student" lookup has something to
    // find. Name comes from the token; grade/accommodations stay blank
    // until an admin fills them in on the Students page, or a later
    // sync pass maps the LMS's own class/grade data onto this field.
    if (!S.students.find(s => s.id === uid)) {
      const rec = { id: uid, name: claims.name || 'Student', grade: null };
      S.students.push(rec);
      persistLocal();
      if (window.BrainovaAPI) window.BrainovaAPI.saveSelf('students', rec);
    }
  }
  if (claims.role === 'parent') {
    U.parentId = uid;
    const existing = S.parents.find(p => p.id === uid);
    if (!existing) {
      const rec = { id: uid, name: claims.name || 'Parent', childIds: children || [] };
      S.parents.push(rec);
      persistLocal();
      if (window.BrainovaAPI) window.BrainovaAPI.saveSelf('parents', rec);
    } else if (children) {
      existing.childIds = children;
      persistLocal();
      if (window.BrainovaAPI) window.BrainovaAPI.saveSelf('parents', existing);
    }
  }

  if (window.BrainovaAPI) {
    window.BrainovaAPI.setAuthToken(token);
    // The LMS hands every device the (non-secret) Sheet URL on login,
    // so a student's own phone/laptop gets wired up the first time they
    // open this, without anyone manually visiting Settings on it. Only
    // the URL travels this way - never the shared token (see
    // AssessmentSystemController::launch() on the LMS side).
    const sheetsUrl = new URLSearchParams(location.search).get('su');
    if (sheetsUrl) window.BrainovaAPI.configure({ url: sheetsUrl });
  }
  return true;
}

function validateDraft(d) {

  if (d.topics.length && !pool.length) err.push('No approved questions exist for the chosen topics and grades. Add or generate questions in the Question bank, or change the selection.');
  counts.forEach(c => { if (!(c.S + c.H + c.E)) warn.push(`${c.topic} has no approved questions and will not be assessed.`); });

## 2. Routes (routes/api.php)

\`\`\`php
Route::prefix('assessments/v1')->middleware(['auth:sanctum'])->group(function () {
    Route::get('assignments', [AssignmentController::class, 'index']);
    Route::post('attempts', [AttemptController::class, 'start'])->middleware('can:take,assessment');
    Route::put('attempts/{attempt}/responses', [AttemptController::class, 'saveResponses']);
    Route::post('attempts/{attempt}/submit', [AttemptController::class, 'submit']);
    Route::post('attempts/{attempt}/events', [AttemptController::class, 'event']);
    Route::get('attempts/{attempt}/report', [ReportController::class, 'show']);
    Route::middleware('role:teacher|admin')->group(function () {
        Route::apiResource('assessments', AssessmentController::class);
        Route::apiResource('questions', QuestionController::class);
        Route::post('assessments/{assessment}/publish', [AssessmentController::class, 'publish']);
        Route::post('attempts/{attempt}/release', [ReportController::class, 'release']);
        Route::put('attempts/{attempt}/placement', [PlacementController::class, 'finalise']);
        Route::post('live-sessions', [LiveSessionController::class, 'store']);
    });
});
\`\`\`

## 3. Repository pattern

\`\`\`php
interface AttemptRepositoryInterface {
    public function start(Assessment $a, int $studentId): Attempt;
    public function saveResponses(Attempt $at, array $responses): Attempt;
    public function submit(Attempt $at): Attempt;
    public function forStudent(int $studentId): Collection;
}
final class EloquentAttemptRepository implements AttemptRepositoryInterface { /* Eloquent queries; no business rules here */ }
// Bind in AppServiceProvider: $this->app->bind(AttemptRepositoryInterface::class, EloquentAttemptRepository::class);
\`\`\`

Keep scoring, adaptive selection and analysis in services (\`AdaptiveEngine\`, \`ScoringService\`, \`PlacementService\`). Port the logic in this app's engine one-to-one so results match: a 3-parameter logistic model with slope 1.2, EAP estimates on a -3 to 3 grid, a topic prior centred on the overall estimate, step limits and prerequisite checks.

## 4. Security and roles

- Authenticate with the existing Laravel guard (Sanctum or Passport). Reuse the LMS users table; never duplicate accounts.
- Roles: admin, teacher, student, parent via spatie/laravel-permission. Policies: students read only their own attempts and only when \`released\`; parents read linked children; teachers read their classes.
- Never send answer keys to the browser during an attempt. Return the presented question without \`answer_key\`; score on the server.
- Store attempts on the server after every answer so a refresh or lost connection does not lose work.
- Rate-limit the attempt endpoints, log access to reports, and keep personal data to what is needed. No facial recognition or invasive monitoring.

## 5. Front end (Blade, Bootstrap, jQuery)

Embed the assessment screens as Blade views. The browser code calls the endpoints above with \`$.ajax\`, sending the CSRF or bearer token. Live sessions use Laravel Reverb (or Pusher) channels: \`live-session.{id}\` for question events and a private channel per student for answers.

## 6. PDFs and exports

Render the report Blade view with barryvdh/laravel-dompdf (or Snappy) for \`?format=pdf\`. CSV exports use \`fastexcel\` or \`maatwebsite/excel\` with the same columns as this app's exports.

## 7. AI question generation

Call the model from a queued job on the server (never from the browser). Save results as \`draft\` questions. A teacher must approve each one before it can appear in an assessment.
`;

function liveTick() {

// Pulls the LMS's current roster in (same-origin, uses the browser's
// existing LMS login - see AssessmentSystemController::roster()), and
// upserts into S.students/S.parents by id so this can be clicked again
// any time a class list changes, without ever creating a duplicate.
ACT.importRoster = async () => {
  toast('Importing from your LMS…'); render();
  let data;
  try {
    const res = await fetch('/assessment-system/roster', { credentials: 'same-origin' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    toast('Could not reach the LMS roster. Make sure you opened this through the LMS, not as a local file.');
    return;
  }
  // Laravel sends real numeric ids; this app compares ids as strings
  // everywhere else (DOM data-id attributes are always strings, and so
  // is every demo id) - converting once, on the way in, is what makes
  // every existing lookup and every assign-to-student checkbox actually
  // match a real student instead of silently finding nothing.
  let added = 0, updated = 0;
  (data.students || []).forEach(r => {
    const id = String(r.id), parentId = r.parentId != null ? String(r.parentId) : null;
    const ex = S.students.find(s => s.id === id);
    if (ex) { ex.name = r.name; if (r.grade != null) ex.grade = r.grade; if (parentId) ex.parentId = parentId; updated++; }
    else { S.students.push({ id, name: r.name, grade: r.grade, parentId }); added++; }
  });
  (data.parents || []).forEach(r => {
    const id = String(r.id), childIds = (r.childIds || []).map(String);
    const ex = S.parents.find(p => p.id === id);
    if (ex) { ex.name = r.name; ex.childIds = childIds.length ? childIds : ex.childIds; }
    else S.parents.push({ id, name: r.name, childIds });
  });
  save(); render();
  toast(`Imported from your LMS: ${added} new, ${updated} updated.`);
};

// The built-in sample roster (Ayesha Khan and the rest) always uses the
// id pattern seedBase() gives it - BRV-26-101, 102, ... for students,
// par_xxxxx for parents - which a real LMS id (always a plain number,
// stringified) never matches, so this can tell them apart safely even
// after both kinds of student are sitting in the same list.

  if (U.cfm !== 'demo') { U.cfm = 'demo'; render(); return; }
  U.cfm = null;

  S.parents = S.parents.filter(p => !String(p.id).startsWith('par_'));
  S.attempts = S.attempts.filter(a => !removedIds.has(a.studentId));
  anCache = new WeakMap();
  save(); render();
  toast('Removed the built-in demo students. Your imported LMS roster stays.');
};

/* init */
function setDefaultIds() { const g5 = S.students.find(s => s.grade === 5) || S.students[0]; U.studentId = g5 && g5.id; U.parentId = S.parents[0] && S.parents[0].id; }
// The admin-managed collections (students/parents/assessments/bank) sync
// to the Sheet on a short debounce after every save() - if this page gets
// reloaded (e.g. the user re-opens Assessment System from the LMS menu)
// in that short window, the fetch below would otherwise return the
// Sheet's still-older copy and silently wipe out whatever was added
// locally seconds earlier (a freshly imported student, a new question,
// a brand-new assessment) before it finished saving. Merging by id - the
// Sheet's copy of anything it already has, plus anything only the local
// copy knows about - means a record can never just disappear because of
// that timing, no matter how slow or fast the sync turns out to be.
function mergeById(localArr, remoteArr) {
  if (!Array.isArray(remoteArr)) return Array.isArray(localArr) ? localArr : [];
  if (!Array.isArray(localArr) || !localArr.length) return remoteArr;
  const seen = new Set(remoteArr.map(r => r.id));
  const localOnly = localArr.filter(r => !seen.has(r.id));
  return localOnly.length ? remoteArr.concat(localOnly) : remoteArr;
}
function init() {
  S = load(); if (!S) { S = seed(); save(); } ensureSample();
  const signedIn = applyLmsIdentity(); // true when a real LMS login token took over role/identity
  if (!signedIn) setDefaultIds();
  render(); // show the cached/local state immediately, never block on the network
  if (window.BrainovaAPI) {
    window.BrainovaAPI.fetchSnapshot().then(remote => {
      if (!remote) return; // not configured yet, offline, or nothing newer - local stays authoritative
      // The Sheet's own "settings" tab starts out empty until someone
      // saves something there - an empty/missing settings on a fetch
      // just means "nothing saved there yet", never "erase the local
      // defaults", so this keeps whatever's already here instead of
      // replacing it with nothing (ensureSample() below repairs it
      // either way, but keeping real local values is still better than
      // falling back to bare defaults every time).
      if (!remote.settings) remote.settings = S.settings;
      ['students', 'parents', 'assessments', 'bank'].forEach(k => { remote[k] = mergeById(S[k], remote[k]); });
      S = remote; anCache = new WeakMap(); ensureSample(); if (!signedIn) setDefaultIds(); persistLocal(); render();
    }).catch(() => { /* stay on the local/cached copy */ });
  }
}
init();
