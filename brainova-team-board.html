<title>Brainova Team Board</title>
<!--
AI AGENT HANDOFF NOTES (read first)
This single HTML file is a working prototype of "Brainova Team Portal": an internal task and performance
management system with two roles (Admin/Owner and Employee) plus a social media team board.
It has no backend. Data is simulated in the browser. Open the file, sign in with a demo account
(password demo1234; owner is admin@brainova.demo), and use the "Developer Handoff" page (admin sidebar)
for the full specification: roles, screens, workflow, business rules, data model, API list,
notification events, what is simulated, and an acceptance checklist.
Code map (search these comment banners in the script):
  PORTAL PART 1  constants, seedPortal() demo data, Api mock endpoints (replace with server calls)
  PORTAL PART 2  shell, views, task modal, event handlers (views only read P and call Api)
  Social board   daily plans, weekly goals, content pipeline, audience analytics, page fixes, setup
Key behaviours added in v4: (1) work log days are pre-laid-out (daySlots()) as one-hour rows with a lunch hour, filled by
dropdown only; (2) reel creation and review are limited to the admin and the Content Coordinator; (3) the coordinator and
the "note down views and followers" duty are transferable responsibilities (P.duties, Api.transferDuty) managed by the admin
under Responsibilities; (4) free text was replaced by dropdowns wherever possible (task or activity pickers, templates,
due-date quick pick, designation, creator, owners).
The Settings page has an "Export for your AI agent" JSON with the same structure in machine-readable form.
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one working board. Header with week control, two person cards that double as the person switch,
   tabs, then a checklist column with a focus column beside it (stacked on phones). */
:root{
  --bg:#F4F5FA; --surface:#FFFFFF; --ink:#171A2C; --muted:#5D6280; --line:#DFE1EC; --track:#E6E8F2;
  --accent:#3350F0; --accent-soft:#E5E9FF; --on-accent:#FFFFFF;
  --teal:#0F8F80; --teal-soft:#DDF3EF;
  --warm:#E9A23B; --good:#1E8E5A; --warn:#B7791F; --bad:#C4402F;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --display:'Bricolage Grotesque',Figtree,system-ui,sans-serif;
  --body:Figtree,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1120; --surface:#181B30; --ink:#ECEEFA; --muted:#9AA0C2; --line:#2A2E4B; --track:#262A46;
    --accent:#7B90FF; --accent-soft:#232A5E; --on-accent:#0F1120;
    --teal:#3CC4B2; --teal-soft:#14332F;
    --warm:#F0B55A; --good:#4CC38A; --warn:#E0A94A; --bad:#EE7A68;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1120; --surface:#181B30; --ink:#ECEEFA; --muted:#9AA0C2; --line:#2A2E4B; --track:#262A46;
  --accent:#7B90FF; --accent-soft:#232A5E; --on-accent:#0F1120;
  --teal:#3CC4B2; --teal-soft:#14332F;
  --warm:#F0B55A; --good:#4CC38A; --warn:#E0A94A; --bad:#EE7A68;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:22px 56px}
.wrap{max-width:1320px;margin-inline:auto}
h1,h2,h3,.pname,.bignum{font-family:var(--display);letter-spacing:-0.01em;text-wrap:balance}
h1{font-size:clamp(26px,5vw,36px);line-height:1.1;margin:4px 0 0;font-weight:700}
h2{font-size:20px;margin:0;font-weight:650}
h3{font-size:16px;margin:0 0 8px;font-weight:650}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end}
.wknav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.wklabel{font-family:var(--mono);font-size:13px;min-width:150px;text-align:center}
details.settings{margin-top:12px;font-size:14px}
details.settings summary,details.add summary{cursor:pointer;color:var(--muted)}
.setrow{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px}
.setrow label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input[type=time],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:20px 8px}
.pc-maira{--pc:var(--accent);--pcs:var(--accent-soft)}
.pc-intern{--pc:var(--teal);--pcs:var(--teal-soft)}
.pcard{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:14px;cursor:pointer}
.pcard.on{border-color:var(--pc)}
.pname{font-size:20px;font-weight:700;color:var(--pc)}
.prole{font-size:13px;color:var(--muted);margin-top:-6px}
.mini{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:13px}
.mini b{font-family:var(--mono);font-weight:500}
.mini .bar{grid-column:1/-1}
.bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:var(--w,0%);background:var(--pc,var(--accent));transition:width .25s}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-block:20px 20px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.notice{background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.notice.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.dchips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:18px}
.dchip{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 2px 0;cursor:pointer;overflow:hidden;position:relative}
.dchip span{font-size:12px;color:var(--muted)}
.dchip b{font-family:var(--mono);font-weight:500;font-size:15px}
.dchip i{display:block;width:100%;height:4px;margin-top:6px;background:linear-gradient(to right,var(--pc) var(--v),var(--track) var(--v))}
.dchip.on{border-color:var(--pc);background:var(--pcs)}
.dchip.today span::after{content:" •";color:var(--warm)}
.listhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline;margin-bottom:6px}
.budget{font-family:var(--mono);font-size:13px;color:var(--muted)}
.budget.over{color:var(--bad)}
ul.tasks{list-style:none;margin:0;padding:0}
.task{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.slot{font-family:var(--mono);font-size:12px;line-height:1.35}
.slot small{color:var(--muted);font-size:12px}
.tbody{display:flex;gap:10px;align-items:flex-start;cursor:pointer;min-width:0}
.tbody input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--pc,var(--accent))}
.ttext{display:flex;flex-direction:column;gap:2px;min-width:0}
.ttext b{font-weight:600}
.tdesc{font-size:13.5px;color:var(--muted)}
.nextfix{font-size:13px;color:var(--pc,var(--accent));margin-top:2px}
.nextfix em{font-style:normal;color:var(--muted)}
.task.done .ttext b{text-decoration:line-through;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:0 4px;align-self:start}
.side{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:16px}
.side dl{margin:0;display:flex;flex-direction:column;gap:12px}
.side dt{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.side dd{margin:2px 0 0;font-size:14px}
.side dd.big{font-family:var(--display);font-size:19px;font-weight:650;color:var(--pc)}
details.add{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.addform{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:flex-end}
.addform label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.addform .grow{flex:1 1 220px}
.group{margin-bottom:26px}
.group h3{margin-bottom:2px}
.ms{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.ms .bar{grid-column:1/-1}
.stepper{display:flex;align-items:center;gap:8px;font-family:var(--mono)}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px;line-height:1}
.stepper button:hover{border-color:var(--pc,var(--accent))}
.stepper span{min-width:44px;text-align:center}
.ms.ok .bar i{background:var(--good)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.today,th.today{background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.fix{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:11px 0;border-top:1px solid var(--line);align-items:center}
.fix .tbody{grid-column:1}
.fixmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--track);color:var(--muted);white-space:nowrap}
.fix.done .ttext b{text-decoration:line-through;color:var(--muted)}
.fix select{padding:4px 8px;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.bignum{font-size:40px;font-weight:700;line-height:1;color:var(--pc)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-block:14px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fields input{width:100%}
.pay-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.pay-line b{font-family:var(--mono);font-weight:500;white-space:nowrap}
.pitch{width:100%;min-height:210px;resize:vertical;line-height:1.55}
.good{color:var(--good)}.bad{color:var(--bad)}
.tier td.cur,.tier tr.cur td{background:var(--accent-soft)}
.foot{margin-top:40px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

.inl{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.kpi .kl{font-size:13px;color:var(--muted)}
.kpi .kv{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1;margin-top:4px}
.kpi .kd{font-size:12px;margin-top:4px;color:var(--muted)}
.kd.up{color:var(--good)}.kd.dn{color:var(--bad)}
.rangebar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:16px}
.rangebar .chips{margin:0}
.rlabel{font-family:var(--mono);font-size:13px;color:var(--muted)}
.chartbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 10px 4px;margin-bottom:16px}
.chartbox svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.14);min-width:140px;z-index:2}
.tip b{font-family:var(--mono);font-weight:500}
.tip .tr{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:4px}
.tip .tk{display:inline-block;width:12px;height:2px;margin-right:6px;vertical-align:middle}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin-bottom:8px}
.legend i{display:inline-block;width:14px;height:2px;margin-right:6px;vertical-align:middle}
.ctag{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--track);border-radius:6px;padding:2px 8px;color:var(--ink);white-space:nowrap}
.ctag i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.rcard{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.rthumb{width:72px;aspect-ratio:9/16;border-radius:6px;overflow:hidden;background:var(--track);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center}
.rthumb img{width:100%;height:100%;object-fit:cover;display:block}
.rbody{min-width:0;display:flex;flex-direction:column;gap:6px}
.rtitle{font-weight:600;overflow-wrap:anywhere}
.rtags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);white-space:nowrap}
.pill.suggested{border-color:var(--warn);color:var(--warn)}
.pill.accepted{border-color:var(--accent);color:var(--accent)}
.pill.production{border-color:var(--teal);color:var(--teal)}
.pill.ready{border-color:var(--good);color:var(--good)}
.pill.published{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.pill.rejected{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.hookprev{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rmeta{font-size:12.5px;color:var(--muted)}
.rlinks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.rlinks a{color:var(--accent)}
details.more summary{cursor:pointer;font-size:13px;color:var(--muted)}
.fullhook{white-space:pre-wrap;font-size:13.5px;margin-top:6px;overflow-wrap:anywhere}
.promptbox{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-height:220px;overflow:auto;font-family:var(--mono);font-size:12.5px;margin-top:4px}
.ract{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:4px}
.ract label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.ract label.inl{flex-direction:row}
.ract .grow{flex:1 1 140px}
.revrow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;width:100%}
.revrow label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.rform{background:var(--surface);border:2px solid var(--accent);border-radius:10px;padding:16px;margin-bottom:20px}
.rform .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.rform label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.rform .full{grid-column:1/-1}
.rform textarea{width:100%;min-height:110px;resize:vertical;line-height:1.5}
.rform input[type=text],.rform input[type=date],.rform select{width:100%}
.thumbprev{width:90px;aspect-ratio:9/16;border-radius:6px;background:var(--track);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-align:center;padding:4px}
.thumbprev img{width:100%;height:100%;object-fit:cover}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:700px;border-left:1px solid var(--line);border-top:1px solid var(--line)}
.cal .dh{padding:6px 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface)}
.cal .cell{min-height:92px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .cell.off{background:transparent}
.cal .cell.today{background:var(--accent-soft)}
.cal .dn{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted)}
.cal .dn button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 2px}
.rchip{display:flex;gap:6px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 6px;font-size:12px;cursor:pointer;color:var(--ink);min-width:0}
.rchip i{width:8px;height:8px;border-radius:50%;flex:none}
.rchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rchip.published{opacity:.6}
.rchip.suggested{border-style:dashed}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.badge{display:inline-block;min-width:18px;text-align:center;background:var(--warm);color:#171A2C;border-radius:9px;font-size:12px;padding:0 6px;margin-left:6px;font-weight:600}
.attn{list-style:none;margin:0;padding:0}
.attn li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.attn li:first-child{border-top:0}
.tone{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px;background:var(--warn)}
.cbar{display:grid;grid-template-columns:minmax(80px,130px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;padding:5px 0}
textarea.mono{font-family:var(--mono);font-size:12.5px;width:100%;min-height:200px;line-height:1.5}
.ctable input[type=text]{width:100%}
.ctable input[type=number]{width:80px}
.ctable td{vertical-align:middle}

/* ---------- portal: shell ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;align-items:start}
.main{min-width:0}
.sidebar{position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 32px);overflow:auto}
.sb-brand{display:flex;flex-direction:column;padding:8px 10px 12px;font-family:var(--display);font-size:18px;line-height:1.15}
.sb-brand span{font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nv{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;width:100%}
.nv:hover{background:var(--track)}

function ck(p,d,id){return p+"-d"+d+"-"+id;}
function tasks(p,d){
  var full=p==="maira"?mairaDaily(d):internDaily(d),buf=full[full.length-1],base=full.filter(function(t){return !S.cfg.hidden["t-"+p+"-"+t.id];});
  var extra=S.cfg.custom.filter(function(c){return c.person===p&&c.scope==="daily";}).map(function(c){return {id:c.id,t:c.title,min:c.min,d:"Added by you.",custom:true};});
  var body=base.filter(function(t){return t!==buf;});return S.cfg.hidden["t-"+p+"-"+buf.id]?body.concat(extra):body.concat(extra,[buf]);
}
function elapsed(ws){var diff=Math.round((today0-ws)/86400000);if(diff<0)return 0;return Math.min(diff+1,6);}
function dayProg(p,ws,d){
  var st=peek(key(ws)),done=0,tot=0;
  tasks(p,d).forEach(function(t){tot+=t.min;if(st.checks[ck(p,d,t.id)])done+=t.min;});
  return {done:done,tot:tot,pct:tot?done/tot:0};
}
function msRaw(m,st,p){return m.kind==="check"?(st.checks[p+"-w-"+m.id]?1:0):Math.min(1,(st.counts[p+"-"+m.id]||0)/m.target);}
function weekProg(p,ws){
  var st=peek(key(ws)),el=elapsed(ws),done=0,tot=0,d;
  for(d=0;d<el;d++){var r=dayProg(p,ws,d);done+=r.done;tot+=r.tot;}
  var f=el/6,sum=0,n=0;
  milestones(p,ws).forEach(function(m){
    if(m.kind==="check"){if(el===6){sum+=msRaw(m,st,p);n++;}}
    else{n++;sum+=Math.min(1,(st.counts[p+"-"+m.id]||0)/Math.max(0.01,m.target*f));}
  });
  var daily=tot?done/tot:null,ms=n?sum/n:null,score=null;
  if(el>0){score=daily==null?ms:(ms==null?daily:0.6*daily+0.4*ms);}
  return {daily:daily,ms:ms,score:score,el:el};
}
function paySc(p){
  var base=mondayOf(today0),vals=[],i;
  for(i=0;i<4;i++){
    var ws=addDays(base,-7*i),st=S.weeks[key(ws)];
    if(!st)continue;
    if(!Object.keys(st.checks).length&&!Object.keys(st.counts).length)continue;
    var s=weekProg(p,ws).score;
    if(s!=null)vals.push(s);
  }
  return vals.length?{avg:vals.reduce(function(a,b){return a+b;},0)/vals.length,n:vals.length}:null;
}
function tierOf(s){var t=TIERS[0],i;for(i=0;i<TIERS.length;i++){if(s>=TIERS[i][0])t=TIERS[i];}return t;}

function allFixes(){
  var a=FIXES.map(function(f){return {id:f[0],week:f[1],plat:f[2],title:f[3],owner:S.cfg.fixOwner[f[0]]||f[4]};});
  S.cfg.customFixes.forEach(function(c){a.push({id:c.id,week:c.week,plat:c.plat,title:c.title,owner:S.cfg.fixOwner[c.id]||c.owner,custom:true});});
  return a.filter(function(f){return !S.cfg.hidden["f-"+f.id];});
}
function nextFix(p){
  var list=allFixes().filter(function(f){return f.owner===p&&!S.cfg.fixDone[f.id];});
  list.sort(function(a,b){return a.week-b.week;});
  return list[0]||null;
}

function bar(label,v){
  return '<div class="mini"><span>'+label+'</span><b>'+(v==null?"—":pct(v)+"%")+'</b><div class="bar"><i style="--w:'+(v==null?0:pct(v))+'%"></i></div></div>';
}

  '<form class="addform" data-form="task"><label class="grow">Task<input type="text" id="nt-title" name="title" maxlength="120" required placeholder="What should they do?"></label>'+

  '<button class="btn pri" type="submit">Add task</button></form></details>';

function daily(){
  var p=V.person,d=V.day,ws=V.ws,st=peek(key(ws)),ts=tasks(p,d),cur=toMin(S.cfg.start);
  var total=ts.reduce(function(a,t){return a+t.min;},0);
  var chips=DAYS.map(function(n,i){
    var pr=dayProg(p,ws,i),dt=addDays(ws,i);
    return '<button class="dchip pc-'+p+(i===d?' on':'')+(sameDay(dt,today0)?' today':'')+'" data-act="day" data-v="'+i+'" aria-pressed="'+(i===d)+'"><span>'+n+'</span><b>'+dt.getDate()+'</b><i style="--v:'+pct(pr.pct)+'%"></i></button>';
  }).join("");
  var rows=ts.map(function(t){
    var s=cur;cur+=t.min;
    var k=ck(p,d,t.id),on=!!st.checks[k],extra="";
    if(t.fix){var nf=nextFix(p);extra=nf?'<span class="nextfix">Next fix: '+esc(nf.title)+' <em>(Week '+nf.week+', '+esc(nf.plat)+')</em></span>':'<span class="nextfix">No open fixes assigned. Assign more in Page fixes.</span>';}
    return '<li class="task'+(on?' done':'')+'"><span class="slot">'+fmtT(s)+'<br><small>'+t.min+' min</small></span>'+
      '<label class="tbody"><input type="checkbox" data-act="chk" data-k="'+k+'" data-fid="'+k+'"'+(on?' checked':'')+(canWrite?'':' disabled')+'>'+
      '<span class="ttext"><b>'+esc(t.t)+'</b><span class="tdesc">'+esc(t.d)+'</span>'+extra+'</span></label>'+
      (canWrite?(t.custom?'<button class="x" data-act="delcustom" data-id="'+t.id+'" aria-label="Remove task">×</button>':'<button class="x" data-act="hide" data-hk="t-'+p+'-'+t.id+'" aria-label="Hide task" title="Hide this task">×</button>'):'<span></span>')+'</li>';
  }).join("");
  var dt=addDays(ws,d),side;
  if(p==="maira"){
    side='<aside class="side pc-maira"><h3>Today\'s focus</h3><dl>'+
      '<div><dt>Main piece</dt><dd class="big">'+esc(PLAN[d].piece)+'</dd></div>'+
      '<div><dt>Story theme</dt><dd><b>'+STORY[d].theme+'.</b> '+esc(STORY[d].how)+'</dd></div>'+
      '<div><dt>If the day runs short</dt><dd>Protect three things first: publish today\'s piece, post today\'s Stories, answer comments and DMs. Everything else can use the buffer.</dd></div>'+
      '<div><dt>Idea quota</dt><dd>'+(peek(key(ws)).counts["maira-ideas"]||0)+' of 5 ideas this week. Update the count in Weekly goals.</dd></div></dl></aside>';
  }else{
    side='<aside class="side pc-intern"><h3>Today\'s focus</h3><dl>'+
      '<div><dt>Hand over next</dt><dd class="big">'+esc(PLAN[(d+1)%6].piece)+'</dd></div>'+
      '<div><dt>Rule</dt><dd>Every piece reaches Maira one working day before it is due, with the script and caption attached.</dd></div>'+
      '<div><dt>Ask at stand-up</dt><dd>Which piece is most urgent, and is anything blocked?</dd></div>'+
      '<div><dt>Today\'s Story theme</dt><dd>'+STORY[d].theme+'. Prepare the frames Maira will post.</dd></div></dl></aside>';
  }
  var note=(isSun&&key(ws)===key(addDays(mondayOf(today0),7)))?'<div class="notice">Today is Sunday, a day off. The board is showing Monday\'s plan.</div>':'';
  return note+'<div class="cols pc-'+p+'"><section><div class="listhead"><h2>'+esc(name(p))+' · '+DAYFULL[d]+' '+dt.getDate()+' '+MON[dt.getMonth()]+'</h2>'+
    '<span class="budget'+(total>420?' over':'')+'">'+total+' of 420 min planned'+(total>420?' · '+(total-420)+' over':'')+'</span></div>'+
    '<div class="dchips">'+chips+'</div><ul class="tasks">'+rows+'</ul>'+addTaskForm()+'</section>'+side+'</div>';
}
function calendar(ws){
  var head='<tr><th>Day</th><th>Post</th><th>Stories</th><th>Intern hands over</th></tr>';
  var body=DAYS.map(function(n,i){
    var t=sameDay(addDays(ws,i),today0)?' class="today"':'';
    return '<tr><td'+t+'><b>'+n+' '+addDays(ws,i).getDate()+'</b></td><td'+t+'>'+esc(PLAN[i].piece)+'</td><td'+t+'>'+STORY[i].theme+'</td><td'+t+'>'+esc(PLAN[(i+1)%6].piece)+'</td></tr>';
  }).join("");
  return '<div class="group"><h3>Publishing calendar</h3><div class="tablewrap"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div></div>';
}
function weekly(){
  var p=V.person,ws=V.ws,st=peek(key(ws)),ms=milestones(p,ws),groups=[],map={};
  ms.forEach(function(m){if(!map[m.g]){map[m.g]=[];groups.push(m.g);}map[m.g].push(m);});
  var html=groups.map(function(g){
    return '<div class="group"><h3>'+g+'</h3>'+map[g].map(function(m){
      if(m.kind==="check"){
        var k=p+"-w-"+m.id,on=!!st.checks[k];
        return '<div class="ms'+(on?' ok':'')+'"><label class="tbody"><input type="checkbox" data-act="chk" data-k="'+k+'" data-fid="'+k+'"'+(on?' checked':'')+(canWrite?'':' disabled')+'><span class="ttext"><b>'+esc(m.t)+'</b></span></label>'+
          (canWrite?(m.custom?'<button class="x" data-act="delcustom" data-id="'+m.id+'" aria-label="Remove goal">×</button>':'<button class="x" data-act="hide" data-hk="m-'+p+'-'+m.id+'" aria-label="Hide goal" title="Hide this goal">×</button>'):'<span></span>')+'</div>';
      }
      var k2=p+"-"+m.id,v=st.counts[k2]||0,full=v>=m.target;
      return '<div class="ms'+(full?' ok':'')+'"><div class="ttext"><b>'+esc(m.t)+'</b></div>'+
        '<div class="stepper"><button data-act="cnt" data-k="'+k2+'" data-d="-1" data-fid="'+k2+'-"'+(canWrite?'':' disabled')+' aria-label="One less">−</button><span>'+v+' / '+m.target+'</span><button data-act="cnt" data-k="'+k2+'" data-d="1" data-fid="'+k2+'+"'+(canWrite?'':' disabled')+' aria-label="One more">+</button>'+(canWrite?'<button class="x" data-act="hide" data-hk="m-'+p+'-'+m.id+'" aria-label="Hide goal" title="Hide this goal">×</button>':'')+'</div>'+
        '<div class="bar"><i style="--w:'+pct(Math.min(1,v/m.target))+'%"></i></div></div>';
    }).join("")+'</div>';
  }).join("");
  var form=canWrite?'<details class="add"><summary>Add a weekly goal for '+esc(name(p))+'</summary><form class="addform" data-form="goal"><label class="grow">Goal<input type="text" id="ng-title" name="title" maxlength="120" required placeholder="e.g. Reply to every comment within 2 hours"></label><button class="btn pri" type="submit">Add goal</button></form></details>':'';
  var wp=weekProg(p,ws);
  return '<div class="cols pc-'+p+'"><section><div class="listhead"><h2>'+esc(name(p))+' · week of '+wkLabel(ws)+'</h2><span class="budget">'+(wp.score==null?'Week not started':'Score so far '+pct(wp.score)+'%')+'</span></div>'+html+form+'</section>'+
    '<aside class="side"><h3>How the score works</h3><p class="tdesc">60% comes from the daily checklist, counted by minutes. 40% comes from the weekly goals, measured against how much of the week has passed. Check-style goals count once the week ends.</p></aside></div>'+
    '<div style="margin-top:24px">'+calendar(ws)+'</div>';
}
function fixes(){
  var all=allFixes(),done=all.filter(function(f){return S.cfg.fixDone[f.id];}).length;
  var list=all.filter(function(f){return V.ff==="all"||f.owner===V.ff;});
  var F=[["all","All"],["maira",name("maira")],["intern",name("intern")],["owner","Owner"]];
  var chips='<div class="chips">'+F.map(function(f){return '<button class="chip'+(V.ff===f[0]?' on':'')+'" data-act="ffilter" data-v="'+f[0]+'">'+esc(f[1])+'</button>';}).join("")+'</div>';
  var groups=[1,2,3,4].map(function(w){
    var items=list.filter(function(f){return f.week===w;});
    if(!items.length)return "";
    var wd=all.filter(function(f){return f.week===w&&S.cfg.fixDone[f.id];}).length,wt=all.filter(function(f){return f.week===w;}).length;
    return '<div class="group"><h3>Week '+w+' · '+WEEKNAMES[w]+' <span class="muted" style="font-weight:400;font-size:14px">'+wd+' of '+wt+' done</span></h3>'+items.map(function(f){
      var on=!!S.cfg.fixDone[f.id];
      var sel='<select id="own-'+f.id+'" data-act="fixowner" data-id="'+f.id+'" aria-label="Owner"'+(canWrite?'':' disabled')+'>'+fixOwners(f.owner).map(function(o){return '<option value="'+o+'"'+(f.owner===o?' selected':'')+'>'+esc(ownerName(o))+'</option>';}).join("")+'</select>';
      return '<div class="fix'+(on?' done':'')+'"><label class="tbody"><input type="checkbox" data-act="fixdone" data-id="'+f.id+'" data-fid="'+f.id+'"'+(on?' checked':'')+(canWrite?'':' disabled')+'><span class="ttext"><b>'+esc(f.title)+'</b></span></label>'+
        '<div class="fixmeta"><span class="tag">'+esc(f.plat)+'</span>'+sel+(canWrite?(f.custom?'<button class="x" data-act="delfix" data-id="'+f.id+'" aria-label="Remove fix">×</button>':'<button class="x" data-act="hide" data-hk="f-'+f.id+'" aria-label="Hide fix" title="Hide this fix">×</button>'):'')+'</div></div>';
    }).join("")+'</div>';
  }).join("");
  var form=canWrite?'<details class="add"><summary>Add a page fix</summary><form class="addform" data-form="fix"><label class="grow">Fix<input type="text" id="nf-title" name="title" maxlength="160" required placeholder="What needs to change on the page?"></label>'+
    '<label>Platform<select id="nf-plat" name="plat"><option>Instagram</option><option>Facebook</option><option>YouTube</option><option>All</option></select></label>'+
    '<label>Week<select id="nf-week" name="week"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label>'+
    '<label>Owner<select id="nf-owner" name="owner"><option value="maira">'+esc(name("maira"))+'</option><option value="intern">'+esc(name("intern"))+'</option><option value="owner">Owner</option></select></label>'+
    '<button class="btn pri" type="submit">Add fix</button></form></details>':'';
  return '<div class="listhead"><h2>Fixes from the September audit</h2><span class="budget">'+done+' of '+all.length+' done</span></div>'+
    '<p class="muted" style="margin-bottom:14px">Grouped by the 30-day plan. Each person\'s next open fix shows up in their daily checklist.</p>'+
    '<div class="bar" style="margin-bottom:18px"><i style="--w:'+pct(all.length?done/all.length:0)+'%"></i></div>'+chips+groups+form;
}
function payCard(p){
  var c=S.cfg.pay[p],sc=paySc(p),best=c.base+c.bonus,diff=best-c.cur;
  var tier=sc?tierOf(sc.avg):null,est=tier?c.base+c.bonus*tier[1]:null;
  var inputs='<div class="fields"><label>Current fixed pay<input type="number" id="pay-'+p+'-cur" min="0" step="500" value="'+c.cur+'" data-act="pay" data-p="'+p+'" data-f="cur"'+(canWrite?'':' disabled')+'></label>'+
    '<label>New base<input type="number" id="pay-'+p+'-base" min="0" step="500" value="'+c.base+'" data-act="pay" data-p="'+p+'" data-f="base"'+(canWrite?'':' disabled')+'></label>'+
    '<label>Performance bonus (max)<input type="number" id="pay-'+p+'-bonus" min="0" step="500" value="'+c.bonus+'" data-act="pay" data-p="'+p+'" data-f="bonus"'+(canWrite?'':' disabled')+'></label></div>';
  var lines='';
  if(c.base+c.bonus>0){
    lines+='<div class="pay-line"><span>Pay at a top score</span><b>'+money(best)+'</b></div>';
    lines+='<div class="pay-line"><span>Compared with today</span><b class="'+(diff>=0?'good':'bad')+'">'+(diff>=0?'+':'−')+money(Math.abs(diff))+'</b></div>';
    if(c.cur>0&&diff<0)lines+='<p class="tdesc bad" style="margin-top:8px">The top tier pays less than today. Raise the bonus so strong work reads as a raise.</p>';
    if(est!=null)lines+='<div class="pay-line"><span>At the current score ('+tier[2]+')</span><b>'+money(est)+'</b></div>';
  }else lines='<p class="tdesc">Enter the amounts above to see the pay range.</p>';
  return '<div class="card pc-'+p+'"><h3 style="color:var(--pc)">'+esc(name(p))+'</h3>'+
    (sc?'<div class="bignum">'+pct(sc.avg)+'%</div><p class="tdesc" style="margin-top:6px">Average over '+sc.n+' tracked week'+(sc.n===1?'':'s')+' (last 4 weeks)</p>':'<p class="tdesc">No tracked weeks yet. The score appears once a week has ticks.</p>')+
    inputs+lines+'</div>';
}
function pay(){
  var tier='<div class="tablewrap"><table class="tier" style="min-width:0"><thead><tr><th>Weekly score</th><th>Bonus paid</th></tr></thead><tbody>'+
    TIERS.map(function(t){return '<tr><td>'+t[2]+'</td><td>'+pct(t[1])+'% of the bonus</td></tr>';}).join("")+'</tbody></table></div>';
  return '<div class="listhead"><h2>Growth pay</h2><span class="budget">Amounts are examples. Change them.</span></div>'+
    '<p class="muted" style="margin-bottom:16px">Pay is a base plus a bonus that follows the weekly score of the social media team board.</p>'+
    '<div class="grid2">'+payCard("maira")+payCard("intern")+'</div>'+
    '<div class="card" style="margin-top:16px;max-width:520px"><h3>How the bonus is earned</h3><p class="tdesc" style="margin-bottom:12px">Based on the average weekly score over the last 4 weeks.</p>'+tier+'</div>';
}
function footText(){
  if(!canWrite)return "You have view-only access, so ticks are turned off.";
  if(status==="shared")return "Ticks save to this page's shared board and show for anyone who can edit it.";
  if(status==="error")return "The shared board could not be reached. Recent changes may not be saved.";
  if(status==="memory")return "Browser storage is blocked, so changes will be lost when this page closes.";
  return "Ticks save in this browser only. Open the page signed in to share them across devices.";
}
var BOARD_TABS=["daily","weekly","content","overview","analytics","fixes","pay","setup"];
function footFull(){return (BOARD_TABS.indexOf(V.tab)>=0?footText()+" ":"")+"Portal data (employees, tasks, logs) is simulated in this browser. It is not shared and not sent anywhere.";}
function paintFoot(){var f=document.getElementById("foot");if(f)f.textContent=footFull();}
function softRender(){
  var a=document.activeElement;
  if(V.edit||V.modal||V.empForm||V.wlEdit||(a&&$app.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&a.type!=="checkbox")){needRender=true;return;}
  render();
}
$app.addEventListener("focusout",function(e){
  if(!needRender||V.edit||V.modal||V.empForm||V.wlEdit)return;
  var n=e.relatedTarget;if(n&&n.closest&&n.closest("form"))return;
  needRender=false;setTimeout(render,0);
});

/* ---------- events ---------- */
$app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.dataset.act;
  if(a==="tab"){V.tab=b.dataset.v;render();}
  else if(a==="person"){V.person=b.dataset.v;render();}
  else if(a==="day"){V.day=+b.dataset.v;render();}
  else if(a==="wk"){
    if(b.dataset.v==="now"){V.ws=isSun?addDays(today0,1):mondayOf(today0);V.day=isSun?0:Math.min((today.getDay()+6)%7,5);}
    else V.ws=addDays(V.ws,7*(+b.dataset.v));
    render();
  }
  else if(a==="cnt"&&canWrite){setCount(b.dataset.k,+b.dataset.d);}
  else if(a==="delcustom"&&canWrite&&isAdmin()){S.cfg.custom=S.cfg.custom.filter(function(c){return c.id!==b.dataset.id;});saveCfg();}
  else if(a==="delfix"&&canWrite&&isAdmin()){S.cfg.customFixes=S.cfg.customFixes.filter(function(c){return c.id!==b.dataset.id;});saveCfg();}
  else if(a==="ffilter"){V.ff=b.dataset.v;render();}
});
$app.addEventListener("change",function(e){
  var t=e.target,a=t.dataset&&t.dataset.act;if(!a||!canWrite)return;
  if(a==="chk"){setCheck(t.dataset.k,t.checked);}
  else if(a==="fixdone"){if(t.checked)S.cfg.fixDone[t.dataset.id]=1;else delete S.cfg.fixDone[t.dataset.id];saveCfg();}
  else if(a==="fixowner"){S.cfg.fixOwner[t.dataset.id]=t.value;saveCfg();}
  else if(a==="pay"){S.cfg.pay[t.dataset.p][t.dataset.f]=Math.max(0,Number(t.value)||0);saveCfg();}
  else if(a==="start"){if(t.value){S.cfg.start=t.value;saveCfg();}}
  else if(a==="iname"){S.cfg.names.intern=t.value.trim()||"Intern";saveCfg();}
  else if(a==="mname"){S.cfg.names.maira=t.value.trim()||"Maira";saveCfg();}
});
$app.addEventListener("submit",function(e){
  e.preventDefault();if(!canWrite)return;
  var f=e.target,kind=f.dataset.form,fd=new FormData(f),title=String(fd.get("title")||"").trim();
  if(!title||["task","goal","fix"].indexOf(kind)<0)return;
  var id="c"+Date.now().toString(36);
  if(kind==="task"){
    var min=Math.max(5,Math.min(240,Number(fd.get("min"))||30));
    S.cfg.custom.push({id:id,person:V.person,scope:fd.get("scope")==="weekly"?"weekly":"daily",title:title,min:min});
  }else if(kind==="goal"){
    S.cfg.custom.push({id:id,person:V.person,scope:"weekly",title:title,min:0});
  }else if(kind==="fix"){
    S.cfg.customFixes.push({id:id,week:Number(fd.get("week"))||1,plat:String(fd.get("plat")||"All"),title:title,owner:String(fd.get("owner")||"maira")});
  }
  saveCfg();
});

function catById(id){var c=S.cfg.categories,i;for(i=0;i<c.length;i++){if(c[i].id===id)return {c:c[i],i:i};}return null;}
function catTag(id){var r=catById(id);return '<span class="ctag"><i style="background:'+(r?catColor(r.i):"var(--muted)")+'"></i>'+esc(r?r.c.label:"Uncategorised")+'</span>';}
function stLabel(s){var x=STATUS.filter(function(a){return a[0]===s;})[0];return x?x[1]:s;}
function pname(o){return o==="owner"?"Owner":o==="audit"?"the September audit":name(o);}
function fmtD(k){if(!k)return "";var d=parseKey(k);return d.getDate()+" "+MON[d.getMonth()];}
function newId(){return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}

function safeThumb(s){return /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(s||"")?s:"";}
function safeUrl(u){return /^https?:\/\/[^\s"'<>]+$/i.test(u||"")?u:"";}
function counted(r){return r.status==="accepted"||r.status==="production"||r.status==="ready"||r.status==="published";}
function normDate(s){
  s=String(s||"").trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  var m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  return m?m[3]+"-"+pad(+m[2])+"-"+pad(+m[1]):"";
}
function parseDelim(text,d){
  var rows=[],row=[],cur="",q=false,i,c;
  text=String(text).replace(/\r\n?/g,"\n");
  for(i=0;i<text.length;i++){
    c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"'&&cur===""){q=true;}
    else if(c===d){row.push(cur);cur="";}
    else if(c==="\n"){row.push(cur);rows.push(row);row=[];cur="";}
    else cur+=c;
  }
  row.push(cur);rows.push(row);
  return rows.filter(function(r){return r.some(function(x){return x.trim()!=="";});}).map(function(r){return r.map(function(x){return x.trim();});});
}
function parseAuto(text){
  var first=String(text).split("\n").filter(function(l){return l.trim();})[0]||"";
  return parseDelim(text,first.indexOf("\t")>=0?"\t":first.indexOf("|")>=0?"|":",");
}
function applyColl(name,snap){

    if(!pending[name+"/"+d.id]){var o=JSON.parse(JSON.stringify(d.data()));o.id=d.id;S[name][d.id]=o;}
  });
  Object.keys(S[name]).forEach(function(id){if(!seen[id]&&!pending[name+"/"+id])delete S[name][id];});
}

function resizeImage(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var sc=Math.min(1,360/im.width),cw=Math.max(1,Math.round(im.width*sc)),ch=Math.max(1,Math.round(im.height*sc));
      var c=document.createElement("canvas");c.width=cw;c.height=ch;
      c.getContext("2d").drawImage(im,0,0,cw,ch);
      cb(c.toDataURL("image/jpeg",0.72));
    };
    im.onerror=function(){cb(null);};
    im.src=fr.result;
  };
  fr.onerror=function(){cb(null);};
  fr.readAsDataURL(file);
}
function docxText(xml){
  var s=xml.replace(/<w:tab\/>/g,"\t").replace(/<w:br[^>]*\/>/g,"\n").replace(/<\/w:p>/g,"\n").replace(/<[^>]+>/g,"");
  s=s.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&");
  return s.replace(/\n{3,}/g,"\n\n").trim();
}

function platIdx(id){var p=S.cfg.platforms,i;for(i=0;i<p.length;i++){if(p[i].id===id)return i;}return -1;}
function platName(id){var i=platIdx(id);return i<0?id:S.cfg.platforms[i].label;}
function fmtN(n){n=Math.round(n);return Math.abs(n)>=1e6?(n/1e6).toFixed(1)+"M":Math.abs(n)>=1e4?(n/1e3).toFixed(1)+"k":n.toLocaleString("en-US");}
var demoCache=null,demoSig="";
function demoMetrics(){
  var sig=JSON.stringify([S.cfg.platforms.map(function(x){return x.id;}),S.cfg.metricFields.map(function(x){return x.id;})]);
  if(demoCache&&demoSig===sig)return demoCache;
  var out=[],seed=7;
  function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
  S.cfg.platforms.forEach(function(p,pi){
    var base=[1800,900,400][pi%3];
    for(var d=69;d>=0;d--){
      var vals={};
      S.cfg.metricFields.forEach(function(f,fi){
        vals[f.id]=f.agg==="last"?Math.round(base*(1+(70-d)*0.004)):Math.round(base*0.12*(1+0.35*Math.sin((70-d)/5+pi+fi))*(0.85+rnd()*0.3));
      });
      out.push({id:dkey(addDays(today0,-d))+"_"+p.id,date:dkey(addDays(today0,-d)),platform:p.id,values:vals});
    }
  });
  demoCache=out;demoSig=sig;return out;
}
function metricsArr(){return V.demo?demoMetrics():Object.keys(S.metrics).map(function(k){var m=S.metrics[k];if(!m.id)m.id=k;return m;});}
function rng(){
  var to=today0,from;
  if(V.range==="custom"){from=V.from?parseKey(V.from):addDays(to,-29);to=V.to?parseKey(V.to):to;}
  else if(V.range==="month"){from=new Date(to.getFullYear(),to.getMonth(),1);}
  else from=addDays(to,-(+V.range-1));
  if(from>to){var t=from;from=to;to=t;}
  return {from:from,to:to};
}
function within(arr,from,to){
  var a=dkey(from),b=dkey(to);
  return arr.filter(function(m){return m.date>=a&&m.date<=b&&(V.mp==="all"||m.platform===V.mp);});
}
function agg(entries,f){
  var any=false,s=0,latest={};
  entries.forEach(function(e){
    var v=e.values&&e.values[f.id];
    if(v==null||isNaN(v))return;
    any=true;
    if(f.agg==="last"){if(!latest[e.platform]||e.date>latest[e.platform].date)latest[e.platform]={date:e.date,v:v};}
    else s+=v;
  });
  if(!any)return null;
  if(f.agg==="last"){return Object.keys(latest).reduce(function(a,k){return a+latest[k].v;},0);}
  return s;
}
function rangeLabel(R){return R.from.getDate()+" "+MON[R.from.getMonth()]+" – "+R.to.getDate()+" "+MON[R.to.getMonth()]+" "+R.to.getFullYear();}
function rangeBar(){
  var R=rng(),P=[["7","7 days"],["14","14 days"],["30","30 days"],["month","This month"],["custom","Custom"]];
  var plats=[["all","All pages"]].concat(S.cfg.platforms.map(function(p){return [p.id,p.label];}));
  return '<div class="rangebar"><div class="chips">'+P.map(function(p){return '<button class="chip'+(V.range===p[0]?" on":"")+'" data-act="rng" data-v="'+p[0]+'">'+p[1]+'</button>';}).join("")+'</div>'+
    (V.range==="custom"?'<label class="inl">From <input type="date" id="rg-from" data-act="rngfrom" value="'+dkey(R.from)+'"></label><label class="inl">To <input type="date" id="rg-to" data-act="rngto" value="'+dkey(R.to)+'"></label>':"")+
    '<div class="chips">'+plats.map(function(p){return '<button class="chip'+(V.mp===p[0]?" on":"")+'" data-act="mplat" data-v="'+esc(p[0])+'">'+esc(p[1])+'</button>';}).join("")+'</div>'+
    '<span class="rlabel">'+rangeLabel(R)+'</span></div>';
}
function kpis(){
  var R=rng(),len=Math.round((R.to-R.from)/86400000)+1,pTo=addDays(R.from,-1),pFrom=addDays(pTo,-(len-1));
  var all=metricsArr(),cur=within(all,R.from,R.to),prev=within(all,pFrom,pTo);
  if(!S.cfg.metricFields.length)return "";
  return '<div class="kpis">'+S.cfg.metricFields.map(function(f){
    var a=agg(cur,f),b=agg(prev,f),dh='<div class="kd">No data for this range</div>';
    if(a!=null){
      dh='<div class="kd">'+(f.agg==="last"?"Latest value":"Total for the range")+'</div>';
      if(b!=null){
        var diff=f.agg==="last"?a-b:(b>0?(a-b)/b*100:null);
        if(diff!=null&&Math.round(diff)!==0){
          var up=diff>0;
          dh='<div class="kd '+(up?"up":"dn")+'" title="Compared with the previous '+len+' days">'+(up?"▲ ":"▼ ")+(f.agg==="last"?fmtN(Math.abs(diff)):Math.abs(Math.round(diff))+"%")+' vs previous '+len+' days</div>';
        }else dh='<div class="kd">No change vs previous '+len+' days</div>';
      }
    }
    return '<div class="kpi"><div class="kl">'+esc(f.label)+'</div><div class="kv">'+(a==null?"—":fmtN(a))+'</div>'+dh+'</div>';
  }).join("")+'</div>';
}
function niceMax(v){if(v<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p;}
function chartHtml(){
  var fs=S.cfg.metricFields;

  var plats=(V.mp==="all"?S.cfg.platforms:S.cfg.platforms.filter(function(p){return p.id===V.mp;}));

    var pts=entries.filter(function(e){return e.platform===p.id&&e.values&&e.values[f.id]!=null&&!isNaN(e.values[f.id]);}).sort(function(a,b){return a.date<b.date?-1:1;}).map(function(e){return {d:e.date,v:e.values[f.id]};});
    return {id:p.id,name:p.label,color:catColor(platIdx(p.id)),pts:pts};
  }).filter(function(s){return s.pts.length;});
  var picker='<label class="inl" style="margin-bottom:10px;display:inline-flex;gap:8px;align-items:center">Chart <select id="mf-pick" data-act="mfield">'+fs.map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===f.id?" selected":"")+'>'+esc(x.label)+'</option>';}).join("")+'</select></label>';

  var W=Math.max(300,Math.min($app.clientWidth||700,1080)-22),H=250,ml=48,mr=14,mt=12,mb=28,pw=W-ml-mr,ph=H-mt-mb;

    g+='<text x="'+xx+'" y="'+(H-8)+'" text-anchor="'+(i===0?"start":i===ticks-1?"end":"middle")+'" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">'+dt.getDate()+" "+MON[dt.getMonth()]+'</text>';
  }
  g+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="var(--muted)" stroke-width="1"/>';
  var byDate={};
  series.forEach(function(s){
    var pts=s.pts.map(function(p){return X(p.d).toFixed(1)+","+Y(p.v).toFixed(1);}).join(" ");
    g+='<polyline points="'+pts+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    var showAll=s.pts.length<=45;
    s.pts.forEach(function(p,k){
      (byDate[p.d]=byDate[p.d]||{})[s.id]=p.v;
      if(showAll||k===s.pts.length-1)g+='<circle cx="'+X(p.d).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3.5" fill="'+s.color+'" stroke="var(--surface)" stroke-width="2"/>';
    });
  });
  CH={W:W,ml:ml,pw:pw,n:n,from:R.from,dates:Object.keys(byDate).sort(),byDate:byDate,series:series,label:f.label,X:X};
  var legend=series.length>1?'<div class="legend">'+series.map(function(s){return '<span><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span>';}).join("")+'</div>':"";
  var title='<div class="rlabel" style="margin-bottom:6px">'+esc(f.label)+(series.length===1?" · "+esc(series[0].name):"")+(f.agg==="last"?" (latest value each day)":" (per day)")+'</div>';

    '<line id="ch-x" x1="0" x2="0" y1="'+mt+'" y2="'+(mt+ph)+'" stroke="var(--muted)" stroke-width="1" hidden/>'+
    '<rect id="chart-hit" x="'+ml+'" y="'+mt+'" width="'+pw+'" height="'+ph+'" fill="transparent"/></svg><div class="tip" id="ch-tip" hidden></div></div>';
}

$app.addEventListener("submit",function(e){
  var f=e.target,kind=f.dataset.form;
  if(["reel","cat","plat","mfield","metric","import-reels","import-metrics"].indexOf(kind)<0)return;
  e.preventDefault();if(!canWrite)return;
  if((kind==="reel"||kind==="import-reels")&&!canContent())return;
  if((kind==="metric"||kind==="import-metrics")&&!canLogAudience())return;
  if((kind==="cat"||kind==="plat"||kind==="mfield")&&!isAdmin())return;
  var fd=new FormData(f);
  function g(n){return String(fd.get(n)||"").trim();}
  if(kind==="reel"){submitReel(f);}
  else if(kind==="cat"){var l=g("label");if(!l)return;S.cfg.categories.push({id:"c"+Date.now().toString(36),label:l,reels:Math.max(0,Math.round(Number(g("reels"))||0)),carousels:Math.max(0,Math.round(Number(g("car"))||0))});saveCfg();}
  else if(kind==="plat"){var pl=g("label");if(!pl)return;S.cfg.platforms.push({id:"p"+Date.now().toString(36),label:pl});saveCfg();}
  else if(kind==="mfield"){var ml2=g("label");if(!ml2)return;S.cfg.metricFields.push({id:"m"+Date.now().toString(36),label:ml2,agg:g("agg")==="last"?"last":"sum"});saveCfg();}
  else if(kind==="metric"){
    var date=normDate(g("date")),vals={},any=false;
    if(!date||!g("platform"))return;
    S.cfg.metricFields.forEach(function(fl){var raw=g("v-"+fl.id);if(raw!==""&&!isNaN(Number(raw))){vals[fl.id]=Number(raw);any=true;}});
    if(!any){V.impMsg="Enter at least one number.";render();return;}
    saveMetric(date,g("platform"),vals);V.impMsg="Saved the numbers for "+fmtD(date)+".";render();
  }
  else if(kind==="import-reels"){
    var rows=parseAuto(g("text")),added=0,skipped=0;
    if(rows.length&&/^title$/i.test(rows[0][0]))rows.shift();
    rows.forEach(function(row){
      var title=(row[0]||"").trim();
      if(!title){skipped++;return;}
      var cl=(row[2]||"").toLowerCase(),cat=S.cfg.categories.filter(function(c){return c.label.toLowerCase()===cl||c.id===cl;})[0];
      var fmt=FORMATS.filter(function(x){return x.toLowerCase()===(row[4]||"").toLowerCase();})[0]||"Reel";
      saveReel({id:newId(),title:title.slice(0,140),format:fmt,category:cat?cat.id:((S.cfg.categories[0]||{}).id||""),hook:(row[1]||"").slice(0,3000),status:canReview?"accepted":"suggested",suggestedBy:meKey(),creator:"",createdDate:dkey(today0),plannedDate:normDate(row[3]),driveLink:"",promptText:"",promptFile:"",promptLink:"",thumb:"",note:"",createdAt:Date.now()});
      added++;
    });
    V.impMsg=added?"Added "+added+" topic"+(added>1?"s":"")+(skipped?". Skipped "+skipped+" rows with no title.":"."):"Nothing was added. Check that each line starts with a title.";
    render();
  }
  else if(kind==="import-metrics"){
    var rs2=parseAuto(g("text")),added2=0,bad=0;
    if(rs2.length>1){
      var head=rs2[0].map(function(h){return h.toLowerCase();});
      var colMap={};
      S.cfg.metricFields.forEach(function(fl){var ix=head.indexOf(fl.label.toLowerCase());if(ix<0)ix=head.indexOf(fl.id.toLowerCase());if(ix>=0)colMap[fl.id]=ix;});
      var di=head.indexOf("date"),pi=head.indexOf("platform");if(pi<0)pi=head.indexOf("page");
      if(di>=0&&pi>=0){
        rs2.slice(1).forEach(function(row){
          var dt=normDate(row[di]),pn=(row[pi]||"").toLowerCase(),plat=S.cfg.platforms.filter(function(p){return p.label.toLowerCase()===pn||p.id===pn;})[0],vals2={},got=false;
          Object.keys(colMap).forEach(function(k){var raw=String(row[colMap[k]]||"").replace(/,/g,"");if(raw!==""&&!isNaN(Number(raw))){vals2[k]=Number(raw);got=true;}});
          if(!dt||!plat||!got){bad++;return;}
          saveMetric(dt,plat.id,vals2);added2++;
        });
        V.impMsg="Imported "+added2+" row"+(added2===1?"":"s")+(bad?". Skipped "+bad+" rows with a missing date, page or numbers.":".");
      }else V.impMsg="The header row needs date and platform columns.";
    }else V.impMsg="Paste a header row and at least one data row.";
    render();
  }
});
$app.addEventListener("pointermove",function(e){
  if(!CH)return;
  var hit=e.target.closest&&e.target.closest("#chart-hit");if(!hit)return;
  var svg=document.getElementById("chart-svg"),tip=document.getElementById("ch-tip"),ln=document.getElementById("ch-x"),box=document.getElementById("chartbox");
  if(!svg||!tip||!ln||!box)return;
  var rect=svg.getBoundingClientRect(),sx=(e.clientX-rect.left)*(CH.W/rect.width);
  var best=null,bd=1e9;
  CH.dates.forEach(function(d){var dx=Math.abs(CH.X(d)-sx);if(dx<bd){bd=dx;best=d;}});
  if(!best)return;
  var x=CH.X(best);

/* Creates the "deadline approaching" and "overdue" notifications.
   In production this is a scheduled job on the server (runs daily or hourly). */

  P.tasks.forEach(function(t){

    if(isOverdue(t)){
      addNotif({to:"admin",type:"overdue",text:eName(t.assignee)+" is overdue on \""+t.title+"\" (due "+fmtD(t.due)+").",taskId:t.id,key:"overdue|admin|"+t.id});

}

/* Business rule: an employee may claim a paid task only when none of their tasks

  if(t.status==="submitted"||t.status==="under_review")return ["review","In review"];

function lineSvg(labels,series,o){

  series.forEach(function(s){
    var seg=[],segs=[];

    if(seg.length)segs.push(seg);
    segs.forEach(function(sg){g+='<polyline points="'+sg.join(" ")+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';});
    s.vals.forEach(function(v,k){if(v!=null)g+='<circle cx="'+X(k).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3.5" fill="'+s.color+'" stroke="var(--surface)" stroke-width="2"><title>'+esc(s.name+", "+labels[k]+": "+f1(v))+'</title></circle>';});

  return lg+'<svg viewBox="0 0 '+W+' '+H+'" class="chartsvg" role="img" aria-label="'+esc(o.label||"Trend chart")+'">'+g+'</svg>';

function colSvg(labels,vals,o){

function perfStats(tasks,logs){

    avgScore:avg(sc.map(function(t){return t.finalScore;})),avgQuality:avg(sc.map(function(t){return t.quality;})),avgRev:avg(sc.map(function(t){return t.revScore;})),

  if(k==="all")return true;
  if(k==="pending")return isOpen(t)&&!isOverdue(t);
  if(k==="overdue")return isOverdue(t);
  if(k==="duetoday")return isOpen(t)&&t.due===T0;
  if(k==="urgent")return t.urgent&&t.status!=="completed";
  if(k==="in_progress")return t.status==="in_progress";
  if(k==="review")return t.status==="submitted"||t.status==="under_review";
  if(k==="revision")return t.status==="revision";
  if(k==="completed")return t.status==="completed";
  if(k==="paid")return t.paid;
  return true;
}

/* The day template: workdayHours one-hour slots starting at settings.dayStart, with a one-hour lunch
   inserted after settings.lunchAfter hours. With the defaults: 8 rows (7 work hours and 1 lunch hour). */
function daySlots(){
  var st=toMin(P.settings.dayStart||"09:00"),w=Math.max(1,Math.round(P.settings.workdayHours)),la=Math.max(1,Math.min(Math.max(1,w-1),P.settings.lunchAfter||4)),out=[],t=st,i;
  for(i=0;i<w;i++){
    if(i===la&&w>1){out.push({start:hhmm(t),end:hhmm(t+60),lunch:true});t+=60;}
    out.push({start:hhmm(t),end:hhmm(t+60),lunch:false});t+=60;
  }
  return out;
}

  return '<div class="handoff"><div class="listhead"><h2>Developer handoff</h2></div><p class="muted" style="margin-bottom:6px;max-width:75ch">This page describes the product this file prototypes, so a developer or AI coding agent can rebuild it in a real application. The prototype is one HTML file. Data is simulated in the browser. Match the screens, workflow, rules and data model below, and replace the mock layer with a backend.</p>'+
  '<h3>1. Product in one paragraph</h3><p style="max-width:75ch">An internal portal where the owner (Admin) manages employees, assigns tasks, tracks daily working hours, reviews submissions with a revision history, scores work out of 10, offers paid tasks and analyses performance. Each employee has a personal dashboard with their tasks, work log, performance, feedback and history. The social media team also has a content board: daily plans with time slots, weekly goals, a topic and reel pipeline with monthly targets, audience numbers, and page fixes from an audit.</p>'+
  '<h3>2. How this file is organised</h3>'+t(["Part","Where","What it contains"],[["Styles","<code>&lt;style&gt;</code> at the top","Colour tokens for light and dark, layout, components"],["Social board","Script, first half","Daily plans, weekly goals, content pipeline, audience analytics, page fixes, setup, JSON export"],["Portal part 1","Comment block \"PORTAL PART 1\"","Constants, helpers, <code>seedPortal()</code> demo data, <code>Api</code> mock endpoints, <code>claimBlockers()</code>"],["Portal part 2","Comment block \"PORTAL PART 2\"","Shell, navigation, every view, task modal, delegated event handlers"]],640)+
  '<h3>3. Roles and access</h3>'+t(["Area","Admin (owner)","Employee","Content coordinator"],[["Sign in","Yes","Yes. Deactivated employees are refused.","Same as employee"],["Employees: add, edit, deactivate","Yes","Own profile only: phone and image","Same as employee"],["View any employee profile, history, attendance, hours, paid history","Yes","Own history and performance only","Same as employee"],["Create, assign, reassign tasks","Yes","No","No"],["Accept, work on, submit own tasks","No","Yes","Yes"],["Review, request revision, approve, score","Yes","No","No"],["Comment on a task","Yes","Yes, on own tasks","Same as employee"],["Claim a paid task","No","Yes, if allowed by the claim rule","Same as employee"],["Mark payment as paid","Yes","No","No"],["Work log: pre-filled day, pick activity, extra entries, submit day","View all","Own, until the day is submitted","Same as employee"],["Organisation analytics and filters","Yes","Own performance only","Same as employee"],["Settings: scoring table, categories, working day, standard activities","Yes","No","No"],["Create, plan, import and edit reels and topics","Yes","No","Yes"],["Review reels: accept, reject, change status, add a note","Yes","No","Yes"],["Note down views and followers (Audience numbers)","Yes","Only the owner of the Views and followers responsibility","Only if they own that responsibility"],["Move any responsibility to anyone (transfer, add, remove)","Yes","No","No"],["Daily plan and weekly goals of the social board","Yes","Employees with a plan key (Maira and the intern)","Same as employee"]],700)+
  '<p class="tdesc" style="max-width:75ch;margin-top:8px">Content coordinator is not a separate account type. It is a <b>responsibility</b> (key <code>content</code>) that the admin can give to any employee and move to someone else at any time; whoever owns it gets the reel rights above. The same mechanism covers the <code>audience</code> responsibility (noting down views and followers) and any other recurring duty the admin adds. The server must check these rights on every request; hiding buttons is not enough.</p><h3>4. Screens</h3>'+t(["Navigation item","Role","Purpose and main parts"],[["Dashboard","Both","Admin: tiles for employees, tasks, paid tasks, scores and revisions; needs-attention list; status split; performance and revision bars; deadlines; login status; recent activity. Employee: today, overdue, urgent, upcoming, paid availability, score, hours, feedback"],["Employees","Admin","List with search of status and score; add and edit form with image; profile with performance, task history, attendance, work hours and paid tasks"],["Tasks / My Tasks","Both","Admin: filter chips, employee, category and search, table. Employee: grouped lists with overdue first"],["Create Task","Admin","Full assignment form including paid tasks and open paid tasks"],["Paid Tasks","Both","Admin: available, claimed, completed, payment status. Employee: available tasks with claim rule banner, own paid tasks and earnings"],["Work Logs / My Work Log","Both","Employee: hour-by-hour entries, daily target bar, submit day, 14-day history. Admin: hours by employee and day for today, week or month, with drill-down"],["Analytics / Performance","Both","Admin: filters (employee, date range, category, status, priority, paid), rankings, comparison table, trends. Employee: personal metrics and charts"],["Task History","Employee","Every task with dates, revisions, scores and feedback"],["Notifications","Both","List with unread state; bell in the top bar with count"],["Settings","Admin","Scoring table, categories, daily hours, social board setup, demo reset, JSON export"],["Task modal","Both","Workflow stepper, instructions, scores, submission and revision history, review form, comments"]],760)+
  '<h3>5. Task workflow</h3><p style="max-width:75ch;margin-bottom:8px">Assigned, then Accepted or In progress, then Submitted, then Under review, then either Revision required (back to In progress for a new submission) or Approved, then Completed. Approval and completion happen in one step. Paid tasks start as Open with no assignee and become In progress when claimed.</p>'+
  t(["From","Action","Actor","To","Side effects"],[["Open (paid)","Claim","Employee","In progress","Admin notified. Blocked by the claim rule"],["Assigned","Accept and start","Employee","In progress","Activity logged"],["In progress or Revision required","Submit work","Employee","Submitted","New submission row. Admin notified"],["Submitted","Start review","Admin","Under review","None"],["Submitted or Under review","Request revision","Admin","Revision required","Comment required. Submission marked as revision. Employee notified"],["Submitted or Under review","Approve and complete","Admin","Completed","Quality score required. Scores computed. Employee notified. Paid task: payment becomes due and admin is notified"],["Completed (paid)","Mark payment as paid","Admin","Completed","Employee notified"]],760)+
  '<h3>6. Business rules</h3><ol class="rules"><li><b>Claim rule.</b> An employee can claim a paid task only if none of their tasks is overdue or in Revision required. Enforce on the server as well as in the interface. Show the blocking tasks.</li><li><b>Overdue.</b> A task is overdue when its status is Assigned, In progress or Revision required and the due date is before today. Submitted work waiting for review is not overdue.</li><li><b>Pending.</b> Open (not completed) and not overdue.</li><li><b>Revision history is permanent.</b> Every submission is stored with its comment, owner comment, result and time. Never delete or overwrite earlier submissions.</li><li><b>Scoring.</b> Final score out of 10 = revision score (0 to 5, from the number of revisions) + quality score (0 to 5, entered by the owner on approval). Keep both parts. Current table: '+rs+'. The table is editable in Settings and applies to all completed tasks.</li><li><b>Attendance.</b> The first sign-in of the day records the login time.</li><li><b>Work log.</b> Entries need a start before the end and cannot overlap. After the employee submits the day, entries are locked.</li><li><b>Notifications.</b> Created on the events listed in section 9. Overdue and deadline notices come from a scheduled job.</li><li><b>Deactivation.</b> Deactivated employees cannot sign in. Their history stays.</li><li><b>Content plan.</b> A reel counts toward a month when it is accepted (or later) and has a planned date in that month.</li></ol>'+

(async function init(){
  var user=null;

    if(window.claude&&window.claude.use){
      db=await window.claude.use("db");
      user=await window.claude.use("user");

  if(db){
    status="shared";
    try{
      db.collection("weeks").onSnapshot(function(snap){
        snap.docs.forEach(function(d){if(!pending["weeks/"+d.id])S.weeks[d.id]=normWeek(d.data());});

    }catch(e){status="error";}

})();
